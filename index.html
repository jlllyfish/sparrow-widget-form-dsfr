<!DOCTYPE html>
<html lang="fr" data-fr-scheme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Formulaire</title>
<link rel="stylesheet" href="vendor/dsfr/dsfr.min.css">
<link rel="stylesheet" href="vendor/dsfr/utility/icons/icons.min.css">
<script src="vendor/qrcode.js"></script>
<style>
  [hidden]{display:none!important}
  html{scroll-padding-bottom:7rem}
  body{background:var(--background-default-grey)}
  #app{min-height:100vh}

  /* ---------- Formulaire (style Démarche Numérique) ---------- */
  .dn-page{max-width:48rem;margin:0 auto;padding:2rem 1rem 8rem}
  .dn-req{color:var(--text-default-error)}
  .dn-logo{margin-bottom:1.5rem}
  .dn-head{display:flex;gap:1.5rem;align-items:flex-start;justify-content:space-between}
  .dn-head__text{flex:1;min-width:0}
  .dn-selfqr{flex:0 0 auto;text-align:center;width:9.5rem}
  .dn-selfqr__btn{display:block;margin:0 auto;padding:0;border:0;background:none;cursor:zoom-in}
  .dn-selfqr__btn:focus-visible{outline:2px solid #0a76f6;outline-offset:2px}
  .dn-qrzoom{border:0;padding:2rem 1.5rem 1.5rem;max-width:calc(100vw - 2rem);text-align:center;background:var(--background-default-grey);color:var(--text-default-grey)}
  .dn-qrzoom::backdrop{background:rgba(22,22,22,.64)}
  .dn-qrzoom img{width:min(70vmin,32rem);height:auto;image-rendering:pixelated;display:block;margin:0 auto 1rem}
  .dn-qrzoom .fr-btn--close{position:absolute;top:.5rem;right:.5rem}
  .dn-selfqr img{width:8.5rem;height:8.5rem;image-rendering:pixelated;display:block;margin:0 auto}
  .dn-selfqr p{font-size:.75rem;line-height:1.1rem;margin:.4rem 0 0;color:var(--text-mention-grey)}
  @media (max-width:576px){.dn-selfqr{display:none}}
  .dn-logo img{max-width:100%;height:auto}
  .dn-section{margin:2.5rem 0 1.5rem;padding-bottom:.75rem;border-bottom:1px solid var(--border-default-grey)}
  .dn-section__num{display:inline-flex;align-items:center;justify-content:center;width:2rem;height:2rem;border-radius:50%;
    background:var(--background-action-high-blue-france);color:var(--text-inverted-blue-france);font-size:1rem;margin-right:.75rem}
  .dn-block{margin-bottom:1.75rem}
  .dn-block>.fr-label,.dn-block>.fr-fieldset__legend,.dn-block .fr-checkbox-group>.fr-label{font-weight:400}
  .dn-block .fr-hint-text{font-weight:400}
  .dn-cols-2>.fr-fieldset__element{flex:0 0 50%;max-width:50%}
  .dn-cols-3>.fr-fieldset__element{flex:0 0 33.333%;max-width:33.333%}
  .dn-inline>.fr-fieldset__element{flex:0 0 auto;width:auto;max-width:none;margin-right:2rem}
  @media (max-width:576px){.dn-cols-2>.fr-fieldset__element,.dn-cols-3>.fr-fieldset__element{flex-basis:100%;max-width:100%}}
  .dn-block.fr-fieldset{margin-bottom:1rem}
  .dn-text p,.dn-text ul,.dn-text ol{margin-bottom:1rem}
  .dn-text>*:last-child,.dn-text>*:last-child>*:last-child{margin-bottom:0}
  .dn-lead p,.dn-lead li{font-size:1.25rem;line-height:2rem}
  .dn-locked .fr-input,.dn-locked .fr-select{background-color:var(--background-contrast-grey);color:var(--text-mention-grey)}
  .dn-status .fr-message{margin-top:.5rem}
  .dn-hp{position:absolute;left:-10000px;width:1px;height:1px;overflow:hidden}
  .dn-footer{position:fixed;left:0;right:0;bottom:0;background:var(--background-default-grey);
    border-top:1px solid var(--border-default-grey);box-shadow:0 -2px 8px rgba(0,0,18,.08);z-index:10}
  .dn-footer__inner{max-width:48rem;margin:0 auto;padding:1rem;display:flex;justify-content:space-between;gap:1rem;align-items:center;flex-wrap:wrap}
  .dn-footer__inner p{margin:0}
  /* ===== Un écran à la fois (question ou section) ===== */
  .dn-steps .dn-block:not(.dn-cur){display:none!important}
  .dn-steps:not(.dn-at-intro) .dn-intro-only{display:none!important}
  .dn-steps:not(.dn-at-recap) #dn-recap{display:none}
  .dn-steps .dn-hp+#form-alert{margin-top:0}
  .dn-progress{position:sticky;top:0;z-index:5;background:var(--background-default-grey);padding:.75rem 0;margin:-1rem 0 1.5rem}
  .dn-progress__bar{height:.25rem;background:var(--background-contrast-grey)}
  .dn-progress__bar span{display:block;height:100%;background:var(--background-active-blue-france);transition:width .3s ease}
  .dn-progress__txt{font-size:.875rem;line-height:1.5rem;margin:.5rem 0 0;color:var(--text-mention-grey)}
  .dn-steps:not(.dn-at-intro) .dn-head{display:none}
  .dn-steps.dn-cont [data-style=section]>.dn-text{display:none}
  .dn-steps.dn-anim .dn-cur{animation:dnIn .28s ease-out both}
  .dn-steps.dn-back .dn-cur{animation-name:dnBack}
  @keyframes dnIn{from{opacity:0;transform:translateY(1rem)}to{opacity:1;transform:none}}
  @keyframes dnBack{from{opacity:0;transform:translateY(-1rem)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.dn-steps .dn-cur{animation:none}}
  .dn-steps .dn-q>.fr-label,.dn-steps .dn-q>.fr-fieldset__legend,.dn-steps .dn-q .fr-checkbox-group>.fr-label{font-size:1.375rem;line-height:1.875rem}
  .dn-steps .dn-q>.fr-label .fr-hint-text,.dn-steps .dn-q>.fr-fieldset__legend .fr-hint-text{font-size:1rem;line-height:1.5rem}
  .dn-steps .dn-q .fr-input,.dn-steps .dn-q .fr-select{font-size:1.125rem;padding-top:.75rem;padding-bottom:.75rem}
  /* choix unique en grandes cases */
  .dn-steps .dn-tiles .fr-fieldset__element{margin-bottom:.75rem}
  .dn-steps .dn-tiles .fr-radio-group{max-width:none;width:100%}
  .dn-steps .dn-tiles .fr-radio-group input[type=radio]+label{border:1px solid var(--border-default-grey);padding:1rem 1rem 1rem 3rem;min-height:3.5rem;justify-content:center;
    background-position:calc(.75rem + 1px) calc(1rem - .25rem + 1px),calc(.75rem + 1px) calc(1rem - .25rem + 1px);cursor:pointer}
  .dn-steps .dn-tiles .fr-radio-group input[type=radio]+label:before{top:1rem;left:1rem;margin-left:0}
  .dn-steps .dn-tiles .fr-radio-group input[type=radio]+label:hover{background-color:var(--background-default-grey-hover)}
  .dn-steps .dn-tiles .fr-radio-group input[type=radio]:checked+label{border-color:var(--border-active-blue-france);box-shadow:inset 0 0 0 1px var(--border-active-blue-france);background-color:var(--background-alt-blue-france)}
  .dn-steps .dn-tiles.dn-inline{display:grid;grid-template-columns:1fr 1fr;column-gap:.75rem}
  .dn-steps .dn-tiles.dn-inline>legend,.dn-steps .dn-tiles.dn-inline>.fr-messages-group,.dn-steps .dn-tiles.dn-inline>.dn-status{grid-column:1/-1}
  .dn-steps .dn-tiles.dn-inline>.fr-fieldset__element{flex:none;max-width:none;width:100%;margin-right:0;padding-left:0;padding-right:0}
  .dn-steps .dn-tiles>.fr-fieldset__element{padding-left:0;padding-right:0}
  .dn-steps .dn-tiles.fr-fieldset{margin-left:0;margin-right:0}
  .dn-steps .dn-tiles>legend,.dn-steps .dn-tiles>.fr-messages-group{padding-left:0;padding-right:0}
  /* récapitulatif */
  .dn-recap h2{margin-bottom:1rem}
  .dn-recap dl{margin:0 0 2rem;padding:0;border-top:1px solid var(--border-default-grey)}
  .dn-recap dt,.dn-recap dd{padding:0}
  .dn-recap__row{display:grid;grid-template-columns:1fr auto;gap:.25rem 1rem;padding:1rem 0;border-bottom:1px solid var(--border-default-grey)}
  .dn-recap dt{font-weight:700;grid-column:1}
  .dn-recap dd{margin:0;grid-column:1;white-space:pre-line;color:var(--text-mention-grey)}
  .dn-recap__edit{grid-column:2;grid-row:1/span 2;align-self:center}
  .dn-recap__sec{font-size:.875rem;text-transform:uppercase;letter-spacing:.03em;color:var(--text-mention-grey);margin:1.5rem 0 .25rem}
  /* barre du bas : Précédent / OK */
  .dn-stepnav{display:flex;gap:1rem;align-items:center;width:100%}
  .dn-stepnav .dn-stepnav__ok,.dn-stepnav__kbd[hidden]+#btn-next,#btn-submit{margin-left:auto}
  .dn-stepnav__kbd{font-size:.75rem;color:var(--text-mention-grey)}
  .dn-steps-on .dn-footer{padding-bottom:env(safe-area-inset-bottom)}
  @media (max-width:576px){
    .dn-steps-on .fr-header{display:none}
    .dn-steps-on.dn-on-intro .fr-header{display:block}
    .dn-stepnav__kbd{display:none}
    .dn-stepnav .fr-btn{min-height:3rem}
    #btn-next,#btn-submit{flex:1;justify-content:center}
    .dn-steps .dn-q>.fr-label,.dn-steps .dn-q>.fr-fieldset__legend{font-size:1.25rem;line-height:1.75rem}
  }
  .dn-ref .fr-tags-group{margin-bottom:.25rem}
  .dn-ref .fr-tag{background-color:var(--background-action-low-blue-france);color:var(--text-action-high-blue-france)}
  .dn-ref__dates{color:var(--text-mention-grey)}
  .dn-foot-ref{margin:0;font-size:.875rem;line-height:1.5rem;color:var(--text-mention-grey);flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dn-foot-ref--on{color:var(--text-default-grey)}
  .dn-stepnav .dn-foot-ref+#btn-prev{margin-left:0}
  .bld-map__extra{display:flex;align-items:center;gap:.75rem;margin:-.25rem 0 .75rem 1rem}
  .bld-map__extra .fr-label{margin:0;white-space:nowrap}
  .bld-map__extra .fr-input{max-width:12rem;margin:0;padding-top:.25rem;padding-bottom:.25rem}
  .bld-map__extra .fr-hint-text{margin:0}
  @media (max-width:576px){.dn-stepnav{flex-wrap:wrap}.dn-stepnav .dn-foot-ref{flex-basis:100%;font-size:.8125rem}}
  .dn-loading{display:flex;align-items:center;gap:1rem;padding:3rem 0}
  .dn-spin{display:inline-block;width:1.5rem;height:1.5rem;border:3px solid var(--border-default-grey);border-top-color:var(--border-active-blue-france);border-radius:50%;animation:dnSpin .8s linear infinite;flex:none}
  .dn-spin--btn{width:1rem;height:1rem;border-width:2px;border-color:rgba(255,255,255,.4);border-top-color:#fff;margin-right:.5rem;vertical-align:-.125rem}
  @keyframes dnSpin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.dn-spin{animation-duration:2s}}
  .dn-sending{opacity:.6;pointer-events:none;transition:opacity .2s}
  .dn-band{padding:.5rem 1rem;display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;background:var(--background-alt-blue-france)}
  .dn-band--preview{background:var(--background-contrast-warning)}
  .dn-band p{margin:0;font-size:.875rem;font-weight:500}
  .dn-toast{position:fixed;top:1rem;right:1rem;z-index:1000;max-width:26rem;background:var(--background-default-grey);box-shadow:0 4px 12px rgba(0,0,18,.16)}
  .fr-header__operator img{max-height:5rem;max-width:9rem;width:auto}

  /* ---------- Configurateur ---------- */
  .bld{padding:1rem 1.25rem 4rem;max-width:80rem;margin:0 auto}
  .bld-top{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;padding-bottom:1rem;border-bottom:1px solid var(--border-default-grey)}
  .bld-top p{margin:0}
  .bld-actions{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
  .bld-tabs{display:flex;gap:.25rem;margin:1rem 0 1.5rem;border-bottom:2px solid var(--border-default-grey);flex-wrap:wrap}
  .bld-tab{padding:.6rem 1rem;background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-2px;font-weight:500;color:var(--text-mention-grey);cursor:pointer}
  .bld-tab:hover{background:var(--background-default-grey-hover)}
  .bld-tab.is-active{color:var(--text-active-blue-france);border-bottom-color:var(--border-active-blue-france)}
  .bld-grid{display:grid;grid-template-columns:minmax(260px,360px) 1fr;gap:2rem;align-items:start}
  .bld-cols2{display:grid;grid-template-columns:1fr 1fr;gap:2.5rem;align-items:start}
  .bld-h{font-size:1.1rem;font-weight:700;margin:0 0 1rem}
  .bld-addbar{display:flex;gap:.5rem;align-items:flex-end;margin-bottom:.75rem}
  .bld-addbar .fr-select-group{margin:0;flex:1}
  .bld-li{display:flex;align-items:center;justify-content:space-between;gap:.25rem;padding:.4rem .5rem .4rem .75rem;
    border:1px solid var(--border-default-grey);margin-bottom:.25rem;cursor:pointer;background:var(--background-default-grey)}
  .bld-li:hover{background:var(--background-default-grey-hover)}
  .bld-li.is-active{border-color:var(--border-active-blue-france);box-shadow:inset 4px 0 0 var(--border-active-blue-france);background:var(--background-alt-blue-france)}
  .bld-li--section{background:var(--background-alt-grey);margin-top:.75rem}
  .bld-li--text{border-style:dashed}
  .bld-li__main{min-width:0;display:flex;flex-direction:column}
  .bld-li__type{font-size:.7rem;text-transform:uppercase;letter-spacing:.03em;color:var(--text-mention-grey)}
  .bld-li__label{font-size:.875rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bld-li--section .bld-li__label{font-weight:700}
  .bld-li__flags{font-size:.7rem;color:var(--text-mention-grey)}
  .bld-li__btns{display:flex;flex-shrink:0}
  .bld-editor{border:1px solid var(--border-default-grey);padding:1.5rem;position:sticky;top:1rem}
  .bld-fieldset{border:1px solid var(--border-default-grey);padding:1rem 1rem .25rem;margin:1.5rem 0 1rem}
  .bld-fieldset legend{font-weight:700;padding:0 .5rem}
  .bld-card{border:1px solid var(--border-default-grey);padding:1.25rem;margin-bottom:1.5rem}
  .bld-card__head{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem}
  .bld-row3{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;align-items:end}
  .bld-row3>.fr-input-group,.bld-row3>.fr-select-group{margin-top:0;margin-bottom:1.5rem}
  .bld-map{display:grid;grid-template-columns:1fr auto 1fr auto;gap:.5rem;align-items:center;margin-bottom:.5rem}
  .bld-map .fr-select-group,.bld-map .fr-input-group{margin:0}
  .bld-map--head{font-size:.75rem;color:var(--text-mention-grey);margin-bottom:.25rem}
  .bld-step{display:flex;align-items:center;gap:.6rem;font-weight:700;margin:1.75rem 0 .25rem}
  .bld-step__n{display:inline-flex;align-items:center;justify-content:center;width:1.6rem;height:1.6rem;border-radius:50%;
    background:var(--background-action-high-blue-france);color:var(--text-inverted-blue-france);font-size:.85rem}
  .bld-insert{margin:-1rem 0 1.5rem}
  .bld-insert select{font-size:.8rem;padding:.2rem .4rem;border:1px solid var(--border-default-grey);background:var(--background-default-grey);color:var(--text-action-high-blue-france);max-width:100%}
  .bld-md-help{font-size:.75rem;color:var(--text-mention-grey);margin:-1rem 0 1.5rem}
  .bld-logo{display:flex;gap:1rem;align-items:center;margin-bottom:1rem}
  .bld-logo img{max-height:80px;max-width:200px;border:1px dashed var(--border-default-grey);padding:.4rem}
  .bld-keys{width:100%;font-size:.85rem}
  .bld-keys td{vertical-align:top}
  .bld-qr{display:grid;grid-template-columns:1fr 300px;gap:2rem;align-items:start}
  .bld-qr__preview{text-align:center}
  #qr-box img{width:260px;height:260px;image-rendering:pixelated;border:1px solid var(--border-default-grey)}
  .bld-qr__empty{width:260px;height:260px;display:flex;align-items:center;justify-content:center;margin:0 auto;
    border:1px dashed var(--border-default-grey);color:var(--text-mention-grey);font-size:.875rem;padding:1rem}
  .bld-link{word-break:break-all;font-family:monospace;font-size:.8rem;background:var(--background-alt-grey);padding:.5rem .75rem;margin:0 0 1rem}
  .bld-btnrow{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:1rem}
  .bld-test-ok{color:var(--text-default-success)} .bld-test-ko{color:var(--text-default-error)}
  .bld-json{width:100%;min-height:24rem;font-family:monospace;font-size:.8rem}
  .bld-forms{display:flex;gap:.5rem;align-items:flex-end;flex-wrap:wrap}
  .bld-forms .fr-select-group{margin:0;min-width:18rem}
  .wiz{max-width:48rem;margin:0 auto;padding:1.5rem 1.25rem 4rem}
  .wiz-nav{display:flex;justify-content:space-between;gap:1rem;margin-top:2rem;padding-top:1rem;border-top:1px solid var(--border-default-grey)}
  .wiz-cols{columns:2;column-gap:2rem}
  .wiz-cols .fr-checkbox-group{break-inside:avoid}
  .wiz-tpl{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}
  .wiz-tpl label{display:block;border:1px solid var(--border-default-grey);padding:1rem;cursor:pointer;height:100%}
  .wiz-tpl input:checked+span{color:var(--text-active-blue-france)}
  .wiz-tpl label:has(input:checked){border-color:var(--border-active-blue-france);box-shadow:inset 0 0 0 1px var(--border-active-blue-france)}
  @media (max-width:760px){.wiz-tpl{grid-template-columns:1fr}.wiz-cols{columns:1}}
  .bld-codes table{width:100%}
  .bld-codes__link{font-family:monospace;font-size:.75rem;word-break:break-all;max-width:28rem}
  .bld-codes td:last-child{white-space:nowrap}
  @media (max-width:760px){.bld-grid,.bld-qr,.bld-row3,.bld-cols2{grid-template-columns:1fr}.bld-editor{position:static}}

  /* ---------- Impression de l'affiche QR ---------- */
  #print-area{display:none}
  @media print{
    body>*:not(#print-area){display:none!important}
    #print-area{display:block!important;text-align:center;padding-top:2cm}
    #print-area .qr{width:10cm;height:10cm;image-rendering:pixelated}
    #print-area .logo{max-height:3cm;max-width:8cm;margin-bottom:1cm}
    #print-area .pa-page{break-after:page;page-break-after:always}
    #print-area .pa-page:last-child{break-after:auto;page-break-after:auto}
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="dn-toast" hidden></div>
<div id="print-area"></div>

<script>
function startApp() {
'use strict';

/* =====================================================================
   PARAMÈTRES D'HÉBERGEMENT (facultatif)
   Adresse du webhook n8n utilisée par la page publique. Si vous la laissez
   vide, elle est transmise dans l'adresse du formulaire (?api=…).
   ===================================================================== */
const DEFAULT_API = 'https://rucher.incubateur-agriculture.beta.gouv.fr/webhook/formulaire-dsfr';   // liens plus courts : &api=… omis quand c’est celle-ci
const FORMS_TABLE = 'Formulaires';
const WF_VERSION = 7;   // version du workflow n8n attendue par cette page

/* =====================================================================
   Contexte d'exécution
   ===================================================================== */
const inGrist = window.parent !== window && typeof grist !== 'undefined';
const URLP = new URLSearchParams(location.search);
const PUBLIC_SLUG = URLP.get('f') || '';
const PUBLIC_API = URLP.get('api') || DEFAULT_API;
let remote = false;   // true : formulaire public servi par n8n

const TYPES = {
  section: 'Titre de section',
  tableselect: 'Choix dans une table (liste avec recherche)',
  contenu: 'Bloc de texte (non saisissable)',
  pagebreak: 'Saut de page (écran par écran)',
  text: 'Texte court',
  textarea: 'Texte long',
  email: 'Adresse électronique',
  tel: 'Téléphone',
  number: 'Nombre',
  date: 'Date',
  select: 'Liste déroulante',
  radio: 'Choix unique (boutons radio)',
  yesno: 'Oui / Non',
  checkbox: 'Case à cocher (une seule case)',
  checkboxes: 'Choix multiple (cases à cocher)'
};
const BLOCK_STYLES = [
  ['paragraphe', 'Paragraphe'], ['titre', 'Titre'], ['chapeau', 'Chapeau (texte d’introduction)'], ['encadre', 'Encadré'],
  ['exergue', 'Mise en exergue'], ['info', 'Information'], ['attention', 'Attention']
];
const TEXTLIKE = ['text', 'textarea', 'email', 'tel', 'number', 'date', 'tableselect'];
// Cibles spéciales du préremplissage (en-tête du formulaire)
const HEAD_TARGETS = [['__title', 'Titre du formulaire'], ['__subtitle', 'Sous-titre du formulaire'], ['__description', 'Introduction du formulaire'],
  ['__ref', 'Référence sous le titre (étiquettes)'], ['__start', 'Date de début (sous le titre)'], ['__end', 'Date de fin (sous le titre)']];
const REF_TARGETS = ['__ref', '__start', '__end'];
const OPS = [
  ['eq', 'est égal à'], ['neq', 'est différent de'], ['contains', 'contient'],
  ['notEmpty', 'est renseigné'], ['empty', 'n’est pas renseigné'],
  ['gt', 'est supérieur à'], ['lt', 'est inférieur à']
];

/* SHARED-START — logique partagée avec le workflow n8n (validation côté serveur) */
const CHOICE_TYPES = ['select', 'radio', 'checkboxes'];
const REGEX_TYPES = ['text', 'textarea', 'email', 'tel'];
const REGEX_PRESETS = {
  none:      { label: 'Aucun contrôle', re: '', msg: '' },
  email:     { label: 'Adresse électronique', re: '^[A-Za-z0-9._%+\\-]+@[A-Za-z0-9\\-]+(\\.[A-Za-z0-9\\-]+)*\\.[A-Za-z]{2,}$',
               msg: 'Saisissez une adresse électronique valide, par exemple prenom.nom@agriculture.gouv.fr' },

function inlineMd(s) {
  return s
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*\w])\*(?!\s)(.+?)\*(?!\w)/g, '$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\(((?:https?:\/\/|mailto:)[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');

function md(src) {
  const text = String(src ?? '').replace(/\r/g, '').trim();
  if (!text) return '';
  const UL = /^\s*[-*•]\s+/, OL = /^\s*\d+[.)]\s+/;
  return text.split(/\n\s*\n/).map(block => {
    const lines = block.split('\n');
    const h = /^(#{2,4})\s+(.*)$/.exec(lines[0]);
    if (h && lines.length === 1) return `<h${h[1].length + 1} class="fr-h6">${inlineMd(esc(h[2]))}</h${h[1].length + 1}>`;
    // suites de lignes : paragraphe, liste à puces ou liste numérotée
    const out = [];
    let kind = null, buf = [];
    const flush = () => {
      if (!buf.length) return;
      if (kind === 'p') out.push('<p>' + buf.map(l => inlineMd(esc(l))).join('<br>') + '</p>');
      else out.push(`<${kind}>` + buf.map(l => '<li>' + inlineMd(esc(l.replace(kind === 'ul' ? UL : OL, ''))) + '</li>').join('') + `</${kind}>`);
      buf = [];
    };
    lines.forEach(l => {
      const k = UL.test(l) ? 'ul' : OL.test(l) ? 'ol' : 'p';
      if (k !== kind) { flush(); kind = k; }

async function loadSchema() {
  if (!inGrist) {
    schema = {};
    Object.entries(MOCK.schema).forEach(([t, cols]) => {
      schema[t] = cols.map(([colId, type]) => ({ colId, label: colId.replace(/_/g, ' '), type, isFormula: false, choices: [] }));
    });
    return;
  }
  try {
    widgetTableId = grist.getSelectedTableId ? await grist.getSelectedTableId() : await grist.selectedTable.getTableId();
  } catch (e) { console.warn('Table du widget introuvable', e); }
  try {
    const [tables, cols] = await Promise.all([
      grist.docApi.fetchTable('_grist_Tables'),
      grist.docApi.fetchTable('_grist_Tables_column')
    ]);
    const idToTable = {};
    tables.id.forEach((id, i) => { idToTable[id] = tables.tableId[i]; });
    const s = {};
    Object.values(idToTable).forEach(t => { s[t] = []; });
    cols.id.forEach((id, i) => {
      const t = idToTable[cols.parentId[i]];
      const colId = cols.colId[i];
      if (!t || colId === 'manualSort' || colId.startsWith('gristHelper_')) return;
      let wo = {};
      try { wo = JSON.parse(cols.widgetOptions[i] || '{}'); } catch (e) { /* ignore */ }
      s[t].push({
        colId, label: cols.label[i] || colId, type: cols.type[i],
        isFormula: !!cols.isFormula[i] && !!cols.formula[i], formula: cols.formula[i] || '',
        choices: Array.isArray(wo.choices) ? wo.choices : [], wo, pos: cols.parentPos[i]
      });
    });
    Object.values(s).forEach(a => a.sort((x, y) => x.pos - y.pos));
    schema = s;
  } catch (e) {
    console.warn('Schéma indisponible', e);
  }

    const r = await callApi(api, { action: 'options', f: slug, rule: rule.id });
    if (!r || r.ok === false) throw new Error((r && r.error) || 'erreur du service');
    return r.options || [];

    if (rule.openColId && d[rule.openColId] && !d[rule.openColId][i]) continue;
    if (rule.formColId && d[rule.formColId] && config.slug && norm(await formValue(rule, d[rule.formColId][i])) !== norm(config.slug)) continue;
    out.push({ value, label: rule.labelColId && d[rule.labelColId] ? String(fromGrist(d[rule.labelColId][i], lt) ?? '') : '' });

  const trig = fieldById(fieldId);

  const key = keyNorm(rawStr);

      const f = fieldById(fid);

        found = idx >= 0;
        if (found && rule.formColId && data[rule.formColId] && config.slug) {
          const fv = await formValue(rule, data[rule.formColId][idx]);
          if (norm(fv) !== norm(config.slug)) found = false;
        }
        if (found && rule.openColId && data[rule.openColId]) closed = !data[rule.openColId][idx];
        if (found) canonical = fromGrist(data[rule.keyColId][idx], kt);
        if (found) values = groupMapped(rule.mappings.filter(m => m.fieldId && m.colId && data[m.colId])

      }

  if (!inGrist) { console.info('[démo] enregistrement', record); showSuccess(Math.floor(Math.random() * 900) + 100, record); return; }
  if (!targetTableId || !schema[targetTableId]) { showFormErrors({}, 'La table des réponses n’existe pas encore : publiez le formulaire (ou utilisez l’aperçu).'); return; }
  setBusy(true);
  try {
    const res = await grist.docApi.applyUserActions([['AddRecord', targetTableId, null, record]]);
    showSuccess(res && res.retValues ? res.retValues[0] : null, record);
  } catch (err) {
    console.error(err);
    setBusy(false);
    showFormErrors({}, 'L’enregistrement a échoué : ' + (err.message || err));
  }
}

// Chaque nouvelle ligne de la table reçoit automatiquement son lien, est ouverte et rattachée à ce formulaire.
async function ensureStagesLinks(l, { createOpen = false } = {}) {
  if (!inGrist || !l || !config.slug || !publicLink()) return null;
  const t = l.tableId, col = id => colsOf(t).find(c => c.colId === id);
  const d = await fetchTableAny(t);
  const ids = d.id || [];
  const acts = [], done = [];
  if (!l.openColId && createOpen) {
    if (!col('Inscriptions_ouvertes')) {
      acts.push(['AddColumn', t, 'Inscriptions_ouvertes', { type: 'Bool', label: 'Inscriptions ouvertes', isFormula: false, formula: 'True', recalcWhen: 0 }]);
      if (ids.length) acts.push(['BulkUpdateRecord', t, ids, { Inscriptions_ouvertes: ids.map(() => true) }]);
      done.push('case « Inscriptions ouvertes »');
    }
    l.openColId = 'Inscriptions_ouvertes';
  } else if (l.openColId && col(l.openColId) && !col(l.openColId).isFormula && !col(l.openColId).formula) {
    acts.push(['ModifyColumn', t, l.openColId, { formula: 'True', recalcWhen: 0 }]);
    done.push('nouvelles lignes ouvertes par défaut');
  }
  const fc = l.formColId && col(l.formColId);
  if (fc && !fc.isFormula) {
    const def = l.formColRef ? `${l.formColRef}.lookupOne(Slug=${JSON.stringify(config.slug)})` : JSON.stringify(config.slug);
    if (fc.formula !== def) { acts.push(['ModifyColumn', t, l.formColId, { formula: def, recalcWhen: 0 }]); done.push(`nouvelles lignes rattachées à « ${config.slug} »`); }
    if (!l.formColRef) {
      const empty = ids.filter((_, k) => !String((d[l.formColId] || [])[k] ?? '').trim());
      if (empty.length) { acts.push(['BulkUpdateRecord', t, empty, { [l.formColId]: empty.map(() => config.slug) }]); done.push(`${empty.length} ligne(s) sans formulaire rattachée(s)`); }
    }
  }
  const formula = lienFormula(l), lien = col('Lien');
  if (!lien) { acts.push(['AddColumn', t, 'Lien', { type: 'Text', isFormula: true, formula }]); done.push('colonne Lien'); }
  else if (lien.formula !== formula) { acts.push(['ModifyColumn', t, 'Lien', { formula, isFormula: true }]); done.push('colonne Lien mise à jour'); }
  if (!acts.length) return [];
  await grist.docApi.applyUserActions(acts);
  lookupCache[t] = null;
  await loadSchema();
  return done;
}
function lienFormula(l) {
  const u = new URL(config.publicUrl);
  const base = u.origin + u.pathname;
  const api = config.apiUrl && config.apiUrl !== DEFAULT_API ? '&api=' + encodeURIComponent(config.apiUrl) : '';
  const formExpr = l.formColId ? (l.formColRef ? `$${l.formColId}.Slug` : `$${l.formColId}`) : '';
  return ['from urllib.parse import quote',
    `if not $${l.keyColId}:`,
    '  return ""',
    `form = ${formExpr ? formExpr + ' or ' : ''}${JSON.stringify(config.slug)}`,
    `return ${JSON.stringify(base + '?f=')} + quote(str(form)) + ${JSON.stringify(api + '&' + urlParamName() + '=')} + quote(str($${l.keyColId}).strip())`
  ].join('\n');
}
function linkFor(code) {

}

  const rule = codesRule();

    const lab = config.urlLabelColId ? d[config.urlLabelColId] : null;
    const lt = colType(rule.tableId, config.urlLabelColId);
    const out = [];
    for (const [i, c] of (d[rule.keyColId] || []).entries()) {
      const code = String(c ?? '').trim();
      if (!code) continue;
      if (rule.formColId && d[rule.formColId] && config.slug && norm(await formValue(rule, d[rule.formColId][i])) !== norm(config.slug)) continue;
      out.push({ code, label: lab ? String(fromGrist(lab[i], lt)) : '', closed: !!(rule.openColId && d[rule.openColId] && !d[rule.openColId][i]) });
    }
    return out;

}

function makeQR(text) {
  if (!text || typeof qrcode === 'undefined') return null;
  if (qrcode.stringToBytesFuncs && qrcode.stringToBytesFuncs['UTF-8']) qrcode.stringToBytes = qrcode.stringToBytesFuncs['UTF-8'];
  const qr = qrcode(0, 'M');
  qr.addData(text);
  qr.make();
  return qr;
}
function qrPngDataUrl(text, cell = 10) {
  const qr = makeQR(text);
  if (!qr) return '';
  const n = qr.getModuleCount(), margin = 4 * cell, size = n * cell + 2 * margin;
  const cv = document.createElement('canvas');
  cv.width = cv.height = size;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, size, size);
  ctx.fillStyle = '#000';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) ctx.fillRect(margin + c * cell, margin + r * cell, cell, cell);
  return cv.toDataURL('image/png');
}

function setPath(obj, path, val) {
  const ks = path.split('.');
  let o = obj;
  for (let i = 0; i < ks.length - 1; i++) {
    if (o[ks[i]] == null || typeof o[ks[i]] !== 'object') o[ks[i]] = {};
    o = o[ks[i]];
  }
  o[ks[ks.length - 1]] = val;
}
function applyBind(el) {
  const bind = el.dataset.bind;
  let m0;
  if (bind.startsWith('ui.')) return false;
  let val = el.type === 'checkbox' ? el.checked
    : el.dataset.kind === 'lines' ? el.value.split('\n').map(s => s.trim()).filter(Boolean)
    : el.type === 'number' ? (el.value === '' ? '' : Number(el.value))
    : el.value;
  if (bind === 'urlParam') val = String(val).toLowerCase().replace(/[^a-z0-9_-]/g, '');
  if (bind === 'responsesDocId' || bind === 'responsesTableId') val = String(val).trim();
  if ((m0 = /^fields\.(\d+)\.colId$/.exec(bind))) {
    const f = config.fields[+m0[1]];
    f.noSave = val === '__none__';
    f.colId = f.noSave ? '' : val;
    return true;
  }
  if (bind === 'slug') val = String(val).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9-]+/g, '-');
  setPath(config, bind, val);
  if (bind === 'targetTableId') targetTableId = val || '';
  let m;
  if ((m = /^fields\.(\d+)\.type$/.exec(bind))) fixField(config.fields[+m[1]]);
  if ((m = /^fields\.(\d+)\.hiddenField$/.exec(bind)) && val) config.fields[+m[1]].required = false;
  if ((m = /^lookups\.(\d+)\.mappings\.(\d+)\.colId$/.exec(bind))) {
    const l = config.lookups[+m[1]], mp = l.mappings[+m[2]];
    const c = l.external ? null : colsOf(l.tableId).find(x => x.colId === val);
    mp.label = c ? c.label : val; mp.type = c ? c.type : '';
  }
  if ((m = /^lookups\.(\d+)\.formColId$/.exec(bind))) {
    const l = config.lookups[+m[1]];
    const t = l.external ? '' : colType(l.tableId, val);
    l.formColRef = t.startsWith('Ref:') ? t.slice(4) : '';
  }
  m = /^lookups\.(\d+)\.(tableId|external)$/.exec(bind);
  if (m && (m[2] === 'external' || el.tagName === 'SELECT')) {
    const l = config.lookups[+m[1]];
    l.keyColId = '';
    l.mappings.forEach(x => { x.colId = ''; });
    if (m[2] === 'external') l.tableId = '';
    l.openColId = ''; l.formColId = ''; l.formColRef = '';
  }
  return true;
}

/* ---------- logo ---------- */
function readLogo(file) {
  return new Promise((resolveP, reject) => {
    const fr = new FileReader();
    fr.onerror = () => reject(new Error('lecture impossible'));
    fr.onload = () => {
      const data = fr.result;
      if (file.type === 'image/svg+xml') {
        if (data.length > 300000) return reject(new Error('SVG trop lourd (300 Ko max)'));
        return resolveP(data);
      }
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, 600 / img.width, 300 / img.height);
        const cv = document.createElement('canvas');
        cv.width = Math.round(img.width * scale); cv.height = Math.round(img.height * scale);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        let out = cv.toDataURL('image/png');
        if (out.length > 300000) out = cv.toDataURL('image/webp', 0.85);
        resolveP(out);
      };
      img.onerror = () => reject(new Error('image illisible'));
      img.src = data;
    };
    fr.readAsDataURL(file);
  });
}

function fieldFromColumn(c) {
  const blob = c.colId + ' ' + c.label;
  let type = 'text';
  if (c.type === 'Numeric' || c.type === 'Int') type = 'number';
  else if (c.type === 'Date' || c.type.startsWith('DateTime')) type = 'date';
  else if (c.type === 'Bool') type = 'yesno';
  else if (c.type === 'Choice') type = 'select';
  else if (c.type === 'ChoiceList') type = 'checkboxes';
  else if (/mail|courriel/i.test(blob)) type = 'email';
  else if (/t[ée]l[ée]phone|portable|mobile|^tel/i.test(blob)) type = 'tel';
  else if (/commentaire|remarque|description|observation|precision|précision/i.test(blob)) type = 'textarea';
  const f = newField(type, c.label);
  f.colId = c.colId;
  if (c.choices && c.choices.length) f.options = c.choices.slice();
  return f;
}

function radiosCtl(bind, options, val, hint) {
  const name = ctlId();
  return `<fieldset class="fr-fieldset" aria-labelledby="${name}_l"><legend class="fr-fieldset__legend fr-fieldset__legend--regular" id="${name}_l">Affichage du formulaire<span class="fr-hint-text">${esc(hint)}</span></legend>
    ${options.map(([v, l], i) => `<div class="fr-fieldset__element fr-fieldset__element--inline"><div class="fr-radio-group">
      <input type="radio" id="${name}_${i}" name="${name}" value="${esc(v)}" data-bind="${bind}"${v === val ? ' checked' : ''}><label class="fr-label" for="${name}_${i}">${esc(l)}</label></div></div>`).join('')}</fieldset>`;
}
const lookupTables = () => [...new Set(config.lookups.map(l => l.tableId).filter(Boolean))];
const toTableId = s => {
  let id = String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^A-Za-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
  if (!/^[A-Za-z]/.test(id)) id = 'T_' + id;
  return id.charAt(0).toUpperCase() + id.slice(1);
};
const autoTableName = () => toTableId('Reponses_' + (config.slug || slugify(formTitle()) || 'formulaire'));
const STOP = new Set('le la les l un une des de du d au aux a et ou en dans sur pour par avec vous votre vos ce cette ces cet est sont etes avez-vous il elle on y ne pas qu que qui quoi quel quelle quels quelles se sa son ses leur leurs nous je j me m t s c'.split(' '));
function colIdFrom(label, used) {
  const words = String(label || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').split(/[^A-Za-z0-9]+/).filter(Boolean);
  const keep = words.filter(w => !STOP.has(w.toLowerCase()));
  let id = (keep.length ? keep : words).slice(0, 4).join('_').slice(0, 40);
  if (!id) id = 'Reponse';
  if (!/^[A-Za-z]/.test(id)) id = 'C_' + id;
  id = id.charAt(0).toUpperCase() + id.slice(1);
  let k = id, n = 2;
  while (used.has(k.toLowerCase())) k = id + '_' + n++;
  used.add(k.toLowerCase());
  return k;
}
function gristTypeFor(f) {
  switch (f.type) {
    case 'number': return ['Numeric', null];
    case 'date': return ['Date', null];
    case 'checkbox': return ['Bool', null];
    case 'select': case 'radio': return ['Choice', { choices: f.options || [] }];
    case 'yesno': return ['Choice', { choices: ['Oui', 'Non'] }];
    case 'checkboxes': return ['ChoiceList', { choices: f.options || [] }];
    default: return ['Text', null];
  }
}
// Crée la table des réponses si besoin et ajoute les colonnes manquantes (types déduits des questions)
async function ensureResponseTable() {
  if (!inGrist) return 0;
  let t = config.targetTableId;
  const created = !t || !schema[t];
  if (created) {
    const want = t || autoTableName();
    const res = await grist.docApi.applyUserActions([['AddTable', want,
      [{ id: 'Recu_le', type: 'DateTime:Europe/Paris', isFormula: false, formula: 'NOW()' }]]]);
    const rv = res && res.retValues && res.retValues[0];
    t = (rv && rv.table_id) || want;
    // page dédiée, pour que la table soit visible ailleurs que dans « Données brutes »
    if (rv && rv.id) { try { await grist.docApi.applyUserActions([['CreateViewSection', rv.id, 0, 'record', null, null]]); } catch (e) { console.warn('Page non créée', e); } }
    await loadSchema();
  }
  config.targetTableId = t; targetTableId = t;
  const cols = colsOf(t);
  const used = new Set(cols.map(c => c.colId.toLowerCase()));
  const acts = [], targets = [];
  config.fields.filter(f => isInput(f) && !f.noSave).forEach(f => {
    const col = cols.find(c => c.colId === f.colId);
    const [type, wo] = gristTypeFor(f);
    if (!col) {
      const colId = f.colId && !used.has(f.colId.toLowerCase()) ? (used.add(f.colId.toLowerCase()), f.colId) : colIdFrom(f.label, used);
      acts.push(['AddColumn', t, colId, Object.assign({ type, isFormula: false, label: String(f.label || colId).slice(0, 80), untieColIdFromLabel: true },
        wo ? { widgetOptions: JSON.stringify(wo) } : {})]);
      targets.push([f, colId]);
    } else if (wo && /^Choice/.test(col.type)) {
      const missing = (wo.choices || []).filter(c => !(col.choices || []).includes(c));
      if (missing.length) acts.push(['ModifyColumn', t, col.colId, { widgetOptions: JSON.stringify(Object.assign({}, col.wo || {}, { choices: (col.choices || []).concat(missing) })) }]);
    }
  });
  if (acts.length) {
    let rets = null; const fails = [];
    try { const res = await grist.docApi.applyUserActions(acts); rets = res && res.retValues ? res.retValues : []; }
    catch (e) {
      // repli : une action à la fois, pour savoir laquelle Grist refuse
      console.warn('Ajout groupé refusé, essai colonne par colonne', e);
      rets = [];
      for (const a of acts) {
        try { const r = await grist.docApi.applyUserActions([a]); rets.push(r && r.retValues ? r.retValues[0] : null); }
        catch (e2) { rets.push(undefined); fails.push(`${a[2]} : ${e2.message || e2}`); }
      }
    }
    let k = 0;
    acts.forEach((a, i) => {
      if (a[0] !== 'AddColumn') return;
      const rv = rets[i];
      if (rv !== undefined) targets[k][0].colId = (rv && rv.colId) || targets[k][1];
      k++;
    });
    await loadSchema();
    if (fails.length) throw new Error(`Grist a refusé ${fails.length} colonne(s) — ${fails.join(' ; ')}`);
  }
  return { created, added: targets.length };
}

      const obj = F('radio', 'Les objectifs ont-ils été atteints ?', { required: true, layout: 'inline', options: ['Oui', 'En partie', 'Non'] });
      const plus = F('textarea', 'Qu’avez-vous le plus apprécié ?', {});
      const moins = F('textarea', 'Que faudrait-il améliorer ?', { required: true, condition: { fieldId: sat.id, op: 'neq', value: 'Très satisfait' } });
      const reco = F('yesno', 'Recommanderiez-vous cette formation à un collègue ?', { required: true });
      return [s, sat, obj, plus, moins, reco];
    } },
  inscription: { label: 'Inscription', desc: 'Coordonnées, hébergement, contraintes, consentement.',
    build: F => {
      const s1 = F('section', 'Vos coordonnées');
      const nom = F('text', 'Nom', { required: true }), prenom = F('text', 'Prénom', { required: true });
      const mail = F('email', 'Adresse électronique', { required: true }), etab = F('text', 'Établissement', {});
      const s2 = F('section', 'Organisation');
      const heb = F('yesno', 'Avez-vous besoin d’un hébergement ?', { required: true });
      const contr = F('textarea', 'Précisez vos contraintes', { required: true, condition: { fieldId: heb.id, op: 'eq', value: 'Oui' } });
      const ok = F('checkbox', 'J’accepte que mes données soient utilisées pour l’organisation de la formation', { required: true });
      return [s1, nom, prenom, mail, etab, s2, heb, contr, ok];
    } },
  vide: { label: 'Formulaire vide', desc: 'Je compose moi-même les questions.', build: () => [] }
};

/* ---------- assistant de création ---------- */
function startWizard() {
  wiz = { step: 1, title: '', slug: '', slugTouched: false, useRef: '', table: '', keyCol: '', labelCol: '', showCols: [], openCol: '',
    fieldLabel: 'Formation suivie', template: 'evaluation' };
  mode = 'wizard';
  renderWizard();
}
const WIZ_STEPS = ['Nom du formulaire', 'Formation choisie', 'Questions', 'Récapitulatif'];
function renderWizard() {
  ctlSeq = 0;
  const w = wiz, n = WIZ_STEPS.length;
  const tables = Object.keys(schema).filter(t => t !== FORMS_TABLE).sort();
  const cols = colsOf(w.table);
  const colOpts = first => [['', first], ...cols.map(c => [c.colId, c.label])];
  const wsel = (label, key, options, val, hint) => { const id = ctlId(); return `<div class="fr-select-group"><label class="fr-label" for="${id}">${esc(label)}${hint ? `<span class="fr-hint-text">${hint}</span>` : ''}</label>
    <select class="fr-select" id="${id}" data-wiz="${key}">${options.map(([v, l]) => opt(v, l, String(v) === String(val ?? ''))).join('')}</select></div>`; };
  const winput = (label, key, val, o = {}) => { const id = ctlId(); return `<div class="fr-input-group"><label class="fr-label" for="${id}">${esc(label)}${o.hint ? `<span class="fr-hint-text">${o.hint}</span>` : ''}</label>
    <input class="fr-input" id="${id}" data-wiz="${key}" value="${esc(val)}" placeholder="${esc(o.ph || '')}"${o.attrs || ''}></div>`; };
  let body = '';
  if (w.step === 1) {
    body = winput('Titre du formulaire', 'title', w.title, { ph: 'Ex. : Évaluation de formation', attrs: ' autofocus' })
      + winput('Identifiant (utilisé dans les liens)', 'slug', w.slug || slugify(w.title), { hint: 'Proposé à partir du titre. Lettres minuscules, chiffres et tirets.', attrs: ' spellcheck="false"' });
  } else if (w.step === 2) {
    body = `<fieldset class="fr-fieldset"><legend class="fr-fieldset__legend fr-fieldset__legend--regular">Le formulaire s’adapte-t-il à une formation (ou un stage, une session…) choisie dans une table Grist ?</legend>
      ${[['oui', 'Oui : l’usager choisit la formation dans une liste, le formulaire affiche ses informations'], ['non', 'Non, le formulaire est le même pour tous']].map(([v, l]) =>
        `<div class="fr-fieldset__element"><div class="fr-radio-group"><input type="radio" id="wr_${v}" name="wiz-ref" data-wiz="useRef" value="${v}"${w.useRef === v ? ' checked' : ''}><label class="fr-label" for="wr_${v}">${l}</label></div></div>`).join('')}</fieldset>`;
    if (w.useRef === 'oui') {
      body += `<div class="bld-row3">${wsel('Table des formations', 'table', [['', '— choisir —'], ...tables.map(t => [t, t])], w.table)}
        ${w.table ? wsel('Colonne du code', 'keyCol', colOpts('— choisir —'), w.keyCol, 'Ex. Code Stage') : ''}
        ${w.table ? wsel('Colonne de l’intitulé', 'labelCol', colOpts('— aucune —'), w.labelCol, 'Affiché dans la liste et comme titre du formulaire') : ''}</div>`;
      if (w.table && w.keyCol) {
        const others = cols.filter(c => ![w.keyCol, w.labelCol, 'Lien'].includes(c.colId) && c.type !== 'Bool');
        body += winput('Libellé du champ de choix', 'fieldLabel', w.fieldLabel, { hint: 'La question posée à l’usager.' });
        body += `<p class="fr-label fr-mt-3w fr-mb-1w">Informations de la formation à afficher dans le formulaire</p>
          <p class="fr-hint-text fr-mb-2w">Chaque colonne cochée devient un bloc de texte rempli automatiquement.</p>
          <div class="wiz-cols">${others.map(c => `<div class="fr-checkbox-group fr-mb-1w"><input type="checkbox" id="wc_${esc(c.colId)}" data-wiz-col="${esc(c.colId)}"${w.showCols.includes(c.colId) ? ' checked' : ''}>
            <label class="fr-label" for="wc_${esc(c.colId)}">${esc(c.label)}</label></div>`).join('') || '<p class="fr-text--sm">Aucune autre colonne.</p>'}</div>`;
        const bools = cols.filter(c => c.type === 'Bool');
        if (bools.length) body += '<div class="fr-mt-3w"></div>' + wsel('Ne proposer que les formations dont cette case est cochée (facultatif)', 'openCol', [['', '— toutes les formations —'], ...bools.map(c => [c.colId, c.label])], w.openCol);
      }
    }
  } else if (w.step === 3) {
    body = `<p class="fr-text--sm">Partez d’un modèle : vous pourrez ensuite modifier, ajouter ou supprimer chaque question.</p>
      <div class="wiz-tpl">${Object.entries(TEMPLATES).map(([k, t]) => `<label><input type="radio" name="wiz-tpl" class="fr-sr-only" data-wiz="template" value="${k}"${w.template === k ? ' checked' : ''}>
        <span class="fr-text--lg fr-text--bold">${esc(t.label)}</span><br><span class="fr-text--sm">${esc(t.desc)}</span></label>`).join('')}</div>`;
  } else {
    const shown = w.showCols.map(c => (cols.find(x => x.colId === c) || {}).label || c);
    body = `<ul class="fr-text--md">
      <li><strong>Titre :</strong> ${esc(w.title)} <span class="fr-text--sm">(${esc(w.slug)})</span></li>
      <li><strong>Formation choisie :</strong> ${w.useRef === 'oui' ? `dans la table <strong>${esc(w.table)}</strong>, par la colonne ${esc(w.keyCol)}${shown.length ? ` ; blocs affichés : ${esc(shown.join(', '))}` : ''}` : 'non'}</li>
      <li><strong>Questions :</strong> ${esc(TEMPLATES[w.template].label)}</li>
      ${w.useRef === 'oui' ? `<li><strong>Liens et QR codes :</strong> chaque ligne de ${esc(w.table)}, y compris les prochaines, reçoit automatiquement son lien (colonne Lien, créée à la publication)${w.openCol ? ', et elle est ouverte par défaut' : ''}</li>` : ''}
      <li><strong>Réponses :</strong> nouvelle table <strong>${esc(toTableId('Reponses_' + w.slug))}</strong>, créée à la publication avec une colonne par question</li></ul>
      <p class="fr-text--sm">Après la création, vous arrivez sur les questions : relisez-les, puis publiez depuis l’onglet « 4. Publication ».</p>`;
  }
  const canNext = w.step === 1 ? !!(w.title.trim() && w.slug) : w.step === 2 ? (w.useRef === 'non' || (w.useRef === 'oui' && w.table && w.keyCol)) : true;
  app.innerHTML = `<div class="wiz">
    <div class="fr-stepper"><h2 class="fr-stepper__title">${esc(WIZ_STEPS[w.step - 1])}<span class="fr-stepper__state">Étape ${w.step} sur ${n}</span></h2>
      <div class="fr-stepper__steps" data-fr-current-step="${w.step}" data-fr-steps="${n}"></div>
      ${w.step < n ? `<p class="fr-stepper__details"><span class="fr-text--bold">Étape suivante :</span> ${esc(WIZ_STEPS[w.step])}</p>` : ''}</div>
    ${body}
    <div class="wiz-nav">
      <button type="button" class="fr-btn fr-btn--secondary" data-act="${w.step === 1 ? 'wizCancel' : 'wizPrev'}">${w.step === 1 ? 'Annuler' : 'Précédent'}</button>
      <button type="button" class="fr-btn${w.step === n ? ' fr-icon-check-line fr-btn--icon-left' : ''}" data-act="${w.step === n ? 'wizCreate' : 'wizNext'}"${canNext ? '' : ' disabled'}>${w.step === n ? 'Créer le formulaire' : 'Suivant'}</button>
    </div></div>`;
}
function wizBuildConfig() {
  const w = wiz, d = docDefaults();
  const F = (type, label, extra) => Object.assign(newField(type, label), extra || {});
  const fields = [], lookups = [];
  let urlField = '';
  if (w.useRef === 'oui') {
    const code = F('tableselect', w.fieldLabel || 'Formation suivie', { required: true, hint: 'Tapez un code ou un mot de l’intitulé' });
    fields.push(code);
    urlField = code.id;
    const maps = [];
    if (w.labelCol) maps.push({ fieldId: '__title', colId: w.labelCol, label: (colsOf(w.table).find(c => c.colId === w.labelCol) || {}).label || w.labelCol });
    if (w.showCols.length) {
      fields.push(F('section', 'La formation'));
      w.showCols.forEach(cid => {
        const c = colsOf(w.table).find(x => x.colId === cid) || { label: cid, type: '' };
        const b = F('contenu', c.label, { style: 'paragraphe' });
        fields.push(b);
        maps.push({ fieldId: b.id, colId: cid, label: c.label, type: c.type });
      });
    }
    const rule = Object.assign(newLookup(), { triggerFieldId: code.id, tableId: w.table, keyColId: w.keyCol, labelColId: w.labelCol,
      openColId: w.openCol, mustMatch: true, lock: true, mappings: maps });
    lookups.push(rule);
  }
  fields.push(...TEMPLATES[w.template].build(F));
  if (lookups[0] && w.labelCol) {
    const c = colsOf(w.table).find(x => x.colId === w.labelCol) || { label: w.labelCol, type: '' };
    const lab = F('text', c.label, { hiddenField: true });
    fields.splice(1, 0, lab);
    lookups[0].mappings.push({ fieldId: lab.id, colId: w.labelCol, label: c.label, type: c.type });
  }
  if (w.template !== 'vide') fields.push(F('contenu', 'Vos données', { style: 'info', hint: 'Vos réponses sont utilisées uniquement pour améliorer nos formations.' }));
  return normalizeConfig(Object.assign({
    title: w.title.trim(), slug: w.slug, fields, lookups, urlField, targetTableId: '',
    subtitle: w.useRef === 'oui' ? 'Choisissez la formation suivie : le questionnaire s’adapte.' : ''
  }, d.header ? { header: d.header } : {}, d.logo ? { logo: d.logo } : {},
  { apiUrl: d.apiUrl || '', publicUrl: d.publicUrl || '', responsesDocId: '' }));
}

const actions = {
  tab: el => { tab = el.dataset.tab; renderBuilder(); },
  sel: el => { selectedFieldId = el.dataset.id; renderBuilder(); },
  add: () => {
    const type = $('[data-bind="ui.addType"]').value;
    const f = newField(type);
    const i = config.fields.findIndex(x => x.id === selectedFieldId);
    config.fields.splice(i >= 0 ? i + 1 : config.fields.length, 0, f);
    selectedFieldId = f.id;
    renderBuilder();
  },
  import: () => {
    const cols = writableCols();
    if (!cols.length) { notify('Aucune colonne modifiable trouvée dans la table ' + (targetTableId || ''), 'warning'); return; }
    const used = new Set(config.fields.map(f => f.colId).filter(Boolean));
    const added = cols.filter(c => !used.has(c.colId)).map(fieldFromColumn);
    config.fields.push(...added);
    if (added.length && !selectedFieldId) selectedFieldId = added[0].id;
    notify(added.length ? `${added.length} champ(s) importé(s).` : 'Toutes les colonnes sont déjà utilisées.', added.length ? 'success' : 'info');
    renderBuilder();
  },
  up: el => move(el.dataset.id, -1),
  down: el => move(el.dataset.id, 1),
  dup: el => {
    const i = config.fields.findIndex(f => f.id === el.dataset.id);
    const copy = JSON.parse(JSON.stringify(config.fields[i]));
    copy.id = uid('f'); if (copy.label) copy.label += ' (copie)'; copy.colId = '';
    config.fields.splice(i + 1, 0, copy);
    selectedFieldId = copy.id;
    renderBuilder();
  },
  del: el => {
    const f = fieldById(el.dataset.id);
    if (!confirm(`Supprimer « ${itemLabel(f)} » ?`)) return;
    config.fields = config.fields.filter(x => x.id !== f.id);
    removeFieldRefs(f.id);
    if (selectedFieldId === f.id) selectedFieldId = config.fields[0] ? config.fields[0].id : null;
    renderBuilder();
  },
  choicesFromCol: el => {
    const f = fieldById(el.dataset.id);
    const col = writableCols().find(c => c.colId === f.colId);
    if (col) f.options = col.choices.slice();
    renderBuilder();
  },
  ruleFor: el => {
    if (config.lookups.some(o => o.triggerFieldId === el.dataset.id)) { tab = 'lookups'; renderBuilder(); return; }
    const l = newLookup();
    l.triggerFieldId = el.dataset.id; l.mustMatch = true; l.lock = true;
    config.lookups.push(l);
    tab = 'lookups';
    renderBuilder();
  },
  addLookup: () => {
    const l = newLookup();
    const email = config.fields.find(f => f.type === 'email');
    if (email) l.triggerFieldId = email.id;
    config.lookups.push(l);
    renderBuilder();
  },
  delLookup: el => { config.lookups.splice(+el.dataset.i, 1); renderBuilder(); },
  addMap: el => { config.lookups[+el.dataset.i].mappings.push({ fieldId: '', colId: '' }); renderBuilder(); },
  delMap: el => { config.lookups[+el.dataset.i].mappings.splice(+el.dataset.j, 1); renderBuilder(); },
  autoMap: el => {
    const l = config.lookups[+el.dataset.i];
    const cols = colsOf(l.tableId);
    let n = 0;
    config.fields.filter(f => isInput(f) && f.id !== l.triggerFieldId && !l.mappings.some(m => m.fieldId === f.id)).forEach(f => {
      const c = cols.find(c => c.colId !== l.keyColId && (labelNorm(c.label) === labelNorm(f.label) || labelNorm(c.colId) === labelNorm(f.colId) || labelNorm(c.colId) === labelNorm(f.label)));
      if (c) { l.mappings.push({ fieldId: f.id, colId: c.colId, label: c.label, type: c.type }); n++; }
    });
    notify(n ? `${n} correspondance(s) ajoutée(s).` : 'Aucune correspondance trouvée par libellé.', n ? 'success' : 'info');
    renderBuilder();
  },
  logoRemove: () => { config.logo.src = ''; renderBuilder(); },
  saveStage: el => {
    addStageLabelField(config.lookups[+el.dataset.i]);
    notify('C’est prêt : cliquez sur « Publier » pour créer les colonnes dans la table des réponses.', 'success');
    renderBuilder();
  },
  newForm: () => {
    if (formsList.length && !confirm('Un seul formulaire suffit pour toutes les formations : chaque nouvelle ligne de la table des formations reçoit automatiquement son lien et son QR code.\n\nCréer quand même un formulaire différent (autres questions) ?')) return;
    if (isDirty() && !confirm('Des modifications ne sont pas enregistrées. Continuer ?')) return;
    startWizard();
  },
  dupForm: async () => {
    if (isDirty() && !confirm('Des modifications ne sont pas enregistrées. Dupliquer quand même la dernière version enregistrée ?')) return;
    const c = JSON.parse(savedJson && savedJson !== '{}' ? savedJson : JSON.stringify(config));
    c.title = (c.title || '') + ' (copie)';
    c.slug = slugify((c.slug || 'formulaire') + '-copie');
    c.targetTableId = '';
    c.fields.forEach(f => { f.colId = ''; });
    formRowId = null;
    config = normalizeConfig(c); targetTableId = '';
    savedJson = '{}';
    try { await saveOptions(); await refreshForms(); notify('Copie créée : ses réponses iront dans une nouvelle table.', 'success'); }
    catch (e) { notify('Copie impossible : ' + (e.message || e), 'error'); }
    tab = 'general'; renderBuilder();
  },
  linkTable: () => {
    let f = config.fields.find(x => x.type === 'tableselect');
    if (!f) { f = newField('tableselect', 'Formation suivie'); f.required = true; config.fields.unshift(f); }
    const l = newLookup();
    l.triggerFieldId = f.id; l.mustMatch = true; l.lock = true;
    config.lookups.push(l);
    if (!config.urlField) config.urlField = f.id;
    renderBuilder();
  },
  makeTable: async () => {
    try {
      const r = await ensureResponseTable();
      await saveOptions();
      notify(r.created ? `Table « ${targetTableId} » créée avec ${r.added} colonne(s).` : r.added ? `${r.added} colonne(s) ajoutée(s) à « ${targetTableId} ».` : 'La table est déjà à jour.', 'success');
    } catch (e) { console.error(e); notify('Création impossible : ' + (e.message || e), 'error'); try { await saveOptions(); } catch (_) { /* ignore */ } }
    renderBuilder();
  },
  wizCancel: () => { wiz = null; mode = 'builder'; renderBuilder(); },
  wizPrev: () => { wiz.step--; renderWizard(); },
  wizNext: () => { wiz.step++; renderWizard(); },
  wizCreate: async () => {
    config = wizBuildConfig();
    formRowId = null; targetTableId = '';
    savedJson = '{}';
    wiz = null; mode = 'builder'; tab = 'fields';
    selectedFieldId = (config.fields.find(f => isInput(f) && f.type !== 'tableselect') || config.fields[0] || {}).id || null;
    try {
      await saveOptions();
      await refreshForms();
      notify('Formulaire créé. Relisez les questions, puis publiez depuis l’onglet « 4. Publication ».', 'success');
    } catch (e) { notify('Enregistrement impossible : ' + (e.message || e), 'error'); }
    renderBuilder();
  },
  save: async () => {
    try { await saveOptions(); await refreshForms(); notify('Configuration enregistrée.', 'success'); }
    catch (e) { console.error(e); notify('Échec de l’enregistrement : ' + (e.message || e) + ' (vérifiez vos droits d’édition).', 'error'); }
    if (mode === 'builder') renderBuilder();
  },
  publish: async () => {
    if (!inGrist) { notify('La publication se fait depuis le widget dans Grist.', 'info'); return; }
    config.slug = slugify(config.slug || formTitle());
    if (!config.slug) { notify('Renseignez un identifiant de formulaire.', 'warning'); return; }
    if (!config.apiUrl && !DEFAULT_API) notify('Pensez à renseigner l’adresse du webhook n8n : sans elle, le lien public ne fonctionne pas.', 'warning');
    try {
      const tb = await ensureResponseTable();
      if (tb.created || tb.added) notify(tb.created ? `Table des réponses « ${targetTableId} » créée.` : `${tb.added} colonne(s) ajoutée(s) à « ${targetTableId} ».`, 'info');
      const sr = stagesRule();
      if (sr) {
        try { const done = await ensureStagesLinks(sr); if (done && done.length) notify(`Table ${sr.tableId} : ${done.join(', ')}.`, 'info'); }
        catch (e) { console.warn(e); notify(`Colonne Lien de ${sr.tableId} non mise à jour : ${e.message || e}`, 'warning'); }
      }
      await saveOptions();
      const row = await findFormRow();
      const d = row.all;
      const twin = (d.Slug || []).findIndex((sl, k) => sl === config.slug && d.id[k] !== row.id);
      if (twin >= 0) { notify(`L’identifiant « ${config.slug} » est déjà utilisé par un autre formulaire : choisissez-en un autre.`, 'error'); renderBuilder(); return; }
      const first = !row.pub;
      await grist.docApi.applyUserActions([['UpdateRecord', FORMS_TABLE, row.id, Object.assign({ Config: JSON.stringify(config) }, first ? { Publie: true } : {})]]);
      notify(first ? 'Formulaire publié.' : 'Formulaire mis à jour.', 'success');
      await refreshForms();
    } catch (e) {
      console.error(e);
      notify('Publication impossible : ' + (e.message || e), 'error');
    }
    renderBuilder();
  },
  testConn: async () => {
    const box = $('#conn-result');
    const api = config.apiUrl || DEFAULT_API;
    const lines = [];
    const add = (ok, t) => lines.push(`<li>${ok ? '✅' : '❌'} ${esc(t)}</li>`);
    const show = () => { box.innerHTML = `<ul class="fr-text--sm fr-mb-2w">${lines.join('')}</ul>`; };
    const trig = {};
    config.lookups.forEach(l => { if (l.triggerFieldId) trig[l.triggerFieldId] = (trig[l.triggerFieldId] || 0) + 1; });
    Object.entries(trig).filter(([, n]) => n > 1).forEach(([fid, n]) =>
      add(false, `${n} règles de préremplissage partent du champ « ${resolve((fieldById(fid) || {}).label || '?')} » : supprimez celles en trop (onglet « 2. Formation choisie »), puis publiez.`));
    config.lookups.filter(l => l.triggerFieldId && (!l.tableId || !l.keyColId)).forEach(l =>
      add(false, `Une règle de préremplissage est incomplète (table ou colonne du code manquante) : complétez-la ou supprimez-la.`));
    if (!api) { add(false, 'Adresse du webhook n8n non renseignée.'); return show(); }
    if (!config.slug) { add(false, 'Identifiant du formulaire non renseigné.'); return show(); }
    box.innerHTML = '<p class="fr-text--sm">Test en cours…</p>';
    let r;
    try { r = await callApi(api, { action: 'ping', f: config.slug }); }
    catch (e) { add(false, `n8n ne répond pas (${e.message}). Vérifiez l’adresse (URL de production, pas /webhook-test/) et que le workflow est activé.`); return show(); }
    if (!r || r.version == null) { add(false, 'n8n répond, mais avec une ancienne version du workflow : réimportez n8n/workflow-n8n-formulaire-dsfr.json.'); return show(); }
    add(true, `n8n répond (workflow version ${r.version}).`);
    if (r.version < WF_VERSION) add(false, `Ce widget attend la version ${WF_VERSION} du workflow : réimportez-le dans n8n.`);
    if (!r.published) {
      add(false, `n8n ne trouve pas le formulaire « ${config.slug} » publié. Cliquez sur Publier, vérifiez la case Publie de la table Formulaires et l’identifiant du document dans le nœud Paramètres de n8n.`);
      return show();
    }
    add(true, `Le formulaire « ${config.slug} » est publié et lu par n8n.`);
    if (inGrist) {
      try { const row = await findFormRow(); if (row && row.pub !== JSON.stringify(config)) add(false, 'Des modifications ne sont pas encore en ligne : cliquez sur Publier.'); } catch (e) { /* ignore */ }
    }
    const rule = config.lookups.find(l => (fieldById(l.triggerFieldId) || {}).type === 'tableselect');
    if (rule) {
      try {
        const o = await callApi(api, { action: 'options', f: config.slug, rule: rule.id });
        const n = o && o.ok ? (o.options || []).length : 0;
        if (o && o.ok) add(n > 0, `${n} choix proposé(s) dans la liste « ${resolve(fieldById(rule.triggerFieldId).label)} ».`
          + (n ? '' : ` Vérifiez dans la table ${rule.tableId} que la colonne du code est remplie${rule.formColId ? `, que la colonne « ${rule.formColId} » contient « ${config.slug} »` : ''}${rule.openColId ? ` et que la case « ${rule.openColId} » est cochée` : ''}.`));
        else add(false, 'Liste de choix : ' + ((o && o.error) || 'erreur'));
        if (o && o.ok && n) {
          const code = o.options[0].value;
          try {
            const lk = await callApi(api, { action: 'lookup', f: config.slug, rule: rule.id, value: code });
            if (!lk || lk.ok === false) add(false, `Préremplissage avec « ${code} » : ${(lk && lk.error) || 'erreur du service'}`);
            else if (!lk.found) add(false, `Préremplissage avec « ${code} » : code non retrouvé par la recherche, alors qu’il figure dans la liste.`);
            else add(true, `Préremplissage testé avec « ${code} » : ${Object.keys(lk.fields || {}).length} élément(s) rempli(s)${lk.closed ? ' (formation signalée close)' : ''}.`);
          } catch (e) { add(false, `Préremplissage avec « ${code} » : ${e.message}`); }
        }
        if (o && o.ok && !n) {
          const d = await callApi(api, { action: 'diag', f: config.slug, rule: rule.id }).catch(() => null);
          const g = d && d.ok && d.diag;
          if (g) {
            const parts = [`${g.total} ligne(s) dans la table ${g.table}`];
            if (+g.sans_code) parts.push(`${g.sans_code} sans code`);
            if (g.formCol) parts.push(`${g.bon_formulaire} avec « ${g.formCol} » = « ${g.slug} » (valeurs trouvées : ${g.valeurs_formulaire || 'aucune'})`);
            if (g.openCol) parts.push(`${g.ouvertes} avec « ${g.openCol} » coché (valeurs trouvées : ${g.valeurs_ouvert || 'aucune'})`);
            parts.push(`${g.retenues} retenue(s)`);
            add(false, 'Diagnostic : ' + parts.join(' ; ') + '.');
          }
        }
      } catch (e) { add(false, 'Liste de choix : ' + e.message); }
    }
    if (config.urlField && !fieldById(config.urlField)) add(false, 'Le champ qui reçoit le code par le lien n’existe plus : choisissez-le de nouveau ci-dessous.');
    show();
  },
  copyPublic: () => { const l = publicLink(); if (l) copyText(l); },
  close: () => {
    if (isDirty() && !confirm('Des modifications ne sont pas enregistrées. Fermer quand même ?')) return;
    config = normalizeConfig(JSON.parse(savedJson));
    mode = 'form'; resetFormState();
    loadContents().then(render);
  },
  preview: () => { mode = 'preview'; resetFormState(); renderForm(); toTop(); },
  qrZoom: () => qrZoom(),
  stepNext: () => stepNext(),
  stepPrev: () => stepPrev(),
  stepGoto: el => { histPush(el.dataset.key); stepReturnRecap = true; showStep(el.dataset.key, -1); },
  back: () => { mode = 'builder'; renderBuilder(); },
  configure: () => openBuilder(),
  newFormFromEmpty: async () => { await loadSchema(); await refreshForms(); startWizard(); },
  newResponse: () => { mode = 'form'; resetFormState(); renderForm(); toTop(); },
  qrPng: () => { const u = qrTarget(); if (u) download(qrPngDataUrl(u, 20), `qrcode-${slugify(formTitle()) || 'formulaire'}.png`); },
  qrSvg: () => {
    const qr = makeQR(qrTarget());
    if (!qr) return;
    const svg = qr.createSvgTag({ cellSize: 10, margin: 40, scalable: true });
    download('data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg), `qrcode-${slugify(formTitle()) || 'formulaire'}.svg`);
  },
  qrPrint: () => { const u = qrTarget(); if (u) printPosters(posterHtml(u, null)); },
  prepStages: async el => {
    const l = config.lookups[+el.dataset.i];
    if (!inGrist) { notify('Cette action se fait depuis le widget dans Grist.', 'info'); return; }
    if (!config.slug || !publicLink()) { notify('Renseignez d’abord l’identifiant du formulaire et l’adresse de la page publique (onglet « 4. Publication »).', 'warning'); tab = 'publish'; renderBuilder(); return; }
    try {
      const done = await ensureStagesLinks(l, { createOpen: true });
      await saveOptions();
      notify(done && done.length ? `Table ${l.tableId} : ${done.join(', ')}. Pensez à publier.` : `La table ${l.tableId} est déjà prête.`, 'success');
    } catch (e) { console.error(e); notify('Modification impossible : ' + (e.message || e), 'error'); }
    renderBuilder();
  },
  codeCopy: el => { const c = lastCodes[+el.dataset.i]; if (c) copyText(linkFor(c.code)); },
  codeQr: el => { const c = lastCodes[+el.dataset.i]; if (c) download(qrPngDataUrl(linkFor(c.code), 20), `qrcode-${slugify(c.code) || 'code'}.png`); },
  codePrint: el => { const c = lastCodes[+el.dataset.i]; if (c) printPosters(posterHtml(linkFor(c.code), c)); },
  codesPrint: () => { if (lastCodes.length) printPosters(lastCodes.map(c => posterHtml(linkFor(c.code), c)).join('')); },
  codesCsv: () => {
    const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
    const csv = '\ufeffcode;intitule;lien\n' + lastCodes.map(c => [c.code, c.label, linkFor(c.code)].map(q).join(';')).join('\n');
    download('data:text/csv;charset=utf-8,' + encodeURIComponent(csv), `liens-${slugify(config.slug || formTitle()) || 'formulaire'}.csv`);
  },
  jsonApply: () => {
    try {
      config = normalizeConfig(JSON.parse($('#json-area').value));
      selectedFieldId = config.fields[0] ? config.fields[0].id : null;
      notify('Configuration appliquée. Pensez à enregistrer.', 'success');
      loadContents().then(renderBuilder);
    } catch (e) { notify('JSON invalide : ' + e.message, 'error'); }
  },
  jsonDownload: () => download('data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(config, null, 2)), `formulaire-${slugify(formTitle()) || 'config'}.json`)
};
function move(id, d) {
  const i = config.fields.findIndex(f => f.id === id), j = i + d;
  if (j < 0 || j >= config.fields.length) return;
  [config.fields[i], config.fields[j]] = [config.fields[j], config.fields[i]];
  renderBuilder();
}

/* ---------- délégation d'événements ---------- */
app.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = actions[el.dataset.act];
  if (fn) { e.preventDefault(); e.stopPropagation(); fn(el); }
});
app.addEventListener('input', e => {
  const el = e.target;
  if (mode === 'wizard' && el.dataset.wiz && el.tagName === 'INPUT' && el.type !== 'radio') {
    wiz[el.dataset.wiz] = el.value;
    if (el.dataset.wiz === 'slug') wiz.slugTouched = true;
    if (el.dataset.wiz === 'title' && !wiz.slugTouched) {
      wiz.slug = slugify(el.value);
      const sl = $('[data-wiz="slug"]'); if (sl) sl.value = wiz.slug;
    }
    const nx = $('[data-act="wizNext"]');
    if (nx && wiz.step === 1) nx.disabled = !(wiz.title.trim() && wiz.slug);
    return;
  }
  if (mode !== 'builder') return;
  if (el.dataset.test != null) { updateRegexTest(); return; }
  if (!el.dataset.bind || el.tagName === 'SELECT' || el.type === 'checkbox') return;
  if (applyBind(el)) refreshLight(el);
  if (['qrUrl', 'slug', 'apiUrl', 'publicUrl'].includes(el.dataset.bind)) updateQR();
  if (['slug', 'apiUrl', 'publicUrl', 'urlParam', 'urlCodes'].includes(el.dataset.bind)) renderCodes();
  if (/\.(regex|regexMessage)$/.test(el.dataset.bind)) updateRegexTest();
});
app.addEventListener('change', async e => {
  const el = e.target;
  if (mode === 'wizard') {
    if (el.dataset.wizCol != null) {
      const c = el.dataset.wizCol;
      wiz.showCols = el.checked ? [...new Set(wiz.showCols.concat(c))] : wiz.showCols.filter(x => x !== c);
      return;
    }
    if (el.dataset.wiz && el.tagName === 'INPUT' && el.type !== 'radio') {
      if (el.dataset.wiz === 'slug') { wiz.slug = slugify(el.value); wiz.slugTouched = true; el.value = wiz.slug; }
      return;
    }
    if (el.dataset.wiz) {
      wiz[el.dataset.wiz] = el.value;
      if (el.dataset.wiz === 'table') { wiz.keyCol = ''; wiz.labelCol = ''; wiz.showCols = []; wiz.openCol = '';
        const cs = colsOf(el.value), find = re => (cs.find(c => re.test(labelNorm(c.colId)) || re.test(labelNorm(c.label))) || {}).colId || '';
        wiz.keyCol = find(/^code/); wiz.labelCol = find(/^(libelle|intitule|titre|nom)/); }
      renderWizard();
    }
    return;
  }
  if (mode !== 'builder') return;
  if (el.dataset.forms != null) {
    if (isDirty() && !confirm('Des modifications ne sont pas enregistrées. Changer quand même de formulaire ?')) { el.value = String(formRowId || ''); return; }
    if (await openForm(el.value)) { tab = 'general'; renderBuilder(); }
    return;
  }
  if (el.dataset.insert != null) {
    const target = $(`[data-bind="${el.dataset.insert}"]`);
    if (target && el.value) {
      const ins = `{{${el.value}}}`;
      const s = target.selectionStart ?? target.value.length, en = target.selectionEnd ?? target.value.length;
      target.value = target.value.slice(0, s) + ins + target.value.slice(en);
      applyBind(target); refreshLight(target);
      target.focus();
    }
    el.value = '';
    return;
  }
  if (el.dataset.logoFile != null && el.files && el.files[0]) {
    try { config.logo.src = await readLogo(el.files[0]); renderBuilder(); }
    catch (err) { notify('Logo refusé : ' + err.message, 'error'); }
    return;
  }
  if (el.dataset.rerender && el.dataset.bind) { applyBind(el); renderBuilder(); return; }
  if (!el.dataset.bind || !(el.tagName === 'SELECT' || el.type === 'checkbox' || el.type === 'radio')) return;
  if (applyBind(el)) {
    renderBuilder();
  }
});

/* =====================================================================
   Démarrage
   ===================================================================== */
function demoConfig() {
  const F = (type, label, extra) => Object.assign(newField(type, label), extra || {});
  const code = F('tableselect', 'Formation suivie', { required: true, colId: 'Code_formation',
    hint: 'Choisissez dans la liste (ex. NAS0EA0001) ou tapez un mot de l’intitulé' });
  const s1 = F('section', 'La formation');
  const infos = F('contenu', 'Informations pratiques', { style: 'paragraphe' });
  const objectifs = F('contenu', 'Objectifs de la formation', { style: 'encadre' });
  const s2 = F('section', 'Votre avis');
  const satisf = F('radio', 'Globalement, êtes-vous satisfait de cette formation ?', { required: true, colId: 'Satisfaction',
    options: ['Très satisfait', 'Satisfait', 'Peu satisfait', 'Pas satisfait'], layout: '2' });
  const obj = F('radio', 'Les objectifs présentés ci-dessus ont-ils été atteints ?', { required: true, colId: 'Objectifs_atteints',
    options: ['Oui', 'En partie', 'Non'] });
  const forts = F('textarea', 'Qu’avez-vous le plus apprécié ?', { colId: 'Points_forts' });
  const amelio = F('textarea', 'Que faudrait-il améliorer ?', { colId: 'Ameliorations', required: true,
    condition: { fieldId: satisf.id, op: 'neq', value: 'Très satisfait' } });
  const reco = F('yesno', 'Recommanderiez-vous cette formation à un collègue ?', { required: true, colId: 'Recommande' });
  const email = F('email', 'Adresse électronique (facultatif, pour être recontacté)', { colId: 'Email', regexPreset: 'emailAgri' });
  const rgpd = F('contenu', 'Vos données', { style: 'info',
    hint: 'Vos réponses sont utilisées uniquement pour améliorer les formations. [En savoir plus](https://www.cnil.fr)' });
  return normalizeConfig({
    title: 'Évaluation de formation',
    subtitle: 'Choisissez la formation suivie : le questionnaire s’adapte.',
    description: 'Vos réponses sont **anonymes** et nous aident à améliorer l’offre de formation.\nDurée : **3 minutes**.',
    header: { enabled: true, brand: 'Ministère\nde l’agriculture\net de la souveraineté\nalimentaire', serviceName: 'Formations au numérique', serviceTagline: 'DRAAF Occitanie' },
    fields: [code, s1, infos, objectifs, s2, satisf, obj, forts, amelio, reco, email, rgpd],
    lookups: [{ id: uid('l'), triggerFieldId: code.id, tableId: 'Formations', keyColId: 'Code', labelColId: 'Intitule', lock: true, mustMatch: true,
      openColId: 'Evaluation_ouverte', formColId: 'Formulaire',
      mappings: [{ fieldId: '__title', colId: 'Intitule', label: 'Intitulé' }, { fieldId: infos.id, colId: 'Dates', label: 'Dates' },
        { fieldId: infos.id, colId: 'Lieu', label: 'Lieu' }, { fieldId: infos.id, colId: 'Formateur', label: 'Formateur' },
        { fieldId: objectifs.id, colId: 'Objectifs', label: 'Objectifs' }] }],
    urlField: code.id, urlParam: 'code', urlLock: true, urlLabelColId: 'Intitule', showQrTop: false,
    slug: 'evaluation-formation', publicUrl: 'https://jlllyfish.github.io/sparrow-widget-form-dsfr/', apiUrl: 'https://n8n.exemple.gouv.fr/webhook/formulaire-dsfr',
    targetTableId: 'Evaluations'
  });
}

// Un seul appel au démarrage : la configuration et, si le lien contient un code, les informations du stage (workflow ≥ 7)
let bootCall = null;
const cfgCacheKey = () => 'dnCfg:' + PUBLIC_API + ':' + PUBLIC_SLUG;
function readCachedConfig() {
  try { const c = JSON.parse(localStorage.getItem(cfgCacheKey()) || 'null'); return c && c.config ? c.config : null; } catch (e) { return null; }
}
function writeCachedConfig(cfg) { try { localStorage.setItem(cfgCacheKey(), JSON.stringify({ at: Date.now(), config: cfg })); } catch (e) { /* ignore */ } }
async function bootRemote() {
  remote = true;
  app.innerHTML = `<main class="dn-page" aria-busy="true"><div class="dn-loading"><span class="dn-spin" aria-hidden="true"></span>
    <p class="fr-text--lg fr-mb-0">Chargement du formulaire…</p></div></main>`;
  try {
    if (!PUBLIC_API) throw new Error('Ce lien est incomplet : il ne contient pas l’adresse du service d’enregistrement. Demandez un nouveau lien ou QR code à l’organisateur.');
    const cached = readCachedConfig();
    const pn = cached && cached.urlParam && !['f', 'api'].includes(cached.urlParam) ? cached.urlParam : 'code';
    const code = String(URLP.get(pn) || URLP.get('code') || '').trim();
    bootCall = callApi(PUBLIC_API, Object.assign({ action: 'config', f: PUBLIC_SLUG }, code ? { value: code } : {}));
    // affichage immédiat avec la dernière version connue, mise à jour dès la réponse
    if (cached) { config = normalizeConfig(cached); savedJson = JSON.stringify(config); renderForm(); toTop(); }
    const r = await bootCall;
    if (!r || r.ok === false || !r.config) { try { localStorage.removeItem(cfgCacheKey()); } catch (e) { /* ignore */ } throw new Error((r && r.error) || 'Ce formulaire n’existe pas ou n’est plus ouvert.'); }
    writeCachedConfig(r.config);
    const fresh = JSON.stringify(normalizeConfig(r.config));
    if (!cached || fresh !== savedJson) {
      config = normalizeConfig(r.config);
      savedJson = fresh;
      resetFormState();
      renderForm();
      toTop();
    }
  } catch (e) {
    console.error(e);
    app.innerHTML = `<main class="dn-page"><div class="fr-alert fr-alert--error"><h1 class="fr-alert__title">Formulaire indisponible</h1>
      <p>${esc(e.message)}</p></div></main>`;
  }
}
// Résultat du stage déjà reçu au démarrage, pour cette règle et ce code ?
async function bootLookup(rule, value) {
  if (!bootCall) return null;
  try {
    const r = await bootCall;
    const lk = r && r.lookup;
    if (lk && lk.rule === rule.id && keyNorm(lk.value) === keyNorm(value)) return lk;
  } catch (e) { /* on refait l’appel normalement */ }
  return null;
}

if (inGrist) {
  grist.ready({ requiredAccess: 'full', allowSelectBy: false, onEditOptions: () => openBuilder() });
  // Anciennes versions : configuration dans les options du widget (reprise automatique)
  const legacy = new Promise(res => { grist.onOptions(o => res(o && o.form ? o.form : null)); setTimeout(() => res(null), 2000); });
  app.innerHTML = '<main class="dn-page"><p class="fr-text--lg">Chargement du formulaire…</p></main>';
  // Widget posé sur la table Formulaires : la ligne sélectionnée choisit le formulaire affiché
  let firstRec = null;
  const recP = new Promise(res => { setTimeout(() => res(null), 1500); grist.onRecord(r => { if (!firstRec) { firstRec = r; res(r); } else onFormRecord(r); }); });
  async function onFormRecord(r) {
    if (!r || widgetTableId !== FORMS_TABLE || String(r.id) === String(formRowId) || mode === 'builder' || mode === 'wizard') return;
    await refreshForms();
    if (await openForm(r.id)) renderForm();
  }
  (async () => {
    await loadSchema();
    await refreshForms();
    let id = null;
    if (widgetTableId === FORMS_TABLE) { const r = await recP; id = r && r.id; }
    if (!id && widgetTableId) { const f = formsList.find(x => x.table === widgetTableId); id = f && f.id; }
    if (!id && formsList.length === 1) id = formsList[0].id;
    if (!(id && await openForm(id))) {
      const old = await legacy;
      if (old) { config = normalizeConfig(old); targetTableId = config.targetTableId || widgetTableId || ''; config.targetTableId = targetTableId; savedJson = '{}'; }
    }
    if (mode === 'form') renderForm();
  })();
} else if (PUBLIC_SLUG) {
  bootRemote();
} else {
  loadSchema().then(async () => {
    config = demoConfig();
    targetTableId = config.targetTableId;
    savedJson = JSON.stringify(config);
    await loadContents();
    renderForm();
  });
}

}
</script>
<script>
/* Chargement de l'API Grist seulement dans Grist, depuis l'instance Grist elle-même
   (repli sur docs.getgrist.com), sans jamais bloquer l'affichage de la page publique. */
(function () {
  function load(src, ms) {
    return new Promise(function (ok, ko) {
      var s = document.createElement('script');
      var t = setTimeout(function () { s.remove(); ko(new Error('délai dépassé')); }, ms);
      s.onload = function () { clearTimeout(t); ok(); };
      s.onerror = function () { clearTimeout(t); s.remove(); ko(new Error('échec du chargement')); };
      s.src = src;
      document.head.appendChild(s);
    });
  }
  async function boot() {
    if (window.parent !== window) {
      var origin = '';
      try { origin = document.referrer ? new URL(document.referrer).origin : ''; } catch (e) { /* ignore */ }
      var list = (origin ? [origin + '/grist-plugin-api.js'] : []).concat(['https://docs.getgrist.com/grist-plugin-api.js']);
      for (var i = 0; i < list.length && typeof grist === 'undefined'; i++) {
        try { await load(list[i], 8000); } catch (e) { console.warn('API Grist non chargée depuis ' + list[i] + ' : ' + e.message); }
      }
    }
    startApp();
  }
  boot();
})();
</script>
